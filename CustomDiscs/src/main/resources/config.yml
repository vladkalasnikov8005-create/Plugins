# ============================================================
#  CustomDiscs v2 — свои пластинки ПОД КЛЮЧ (Minecraft 26.2, Paper)
#
#  КАК ПОЛЬЗОВАТЬСЯ (максимально просто):
#   1. Кидаешь аудиофайлы (mp3, ogg, wav, flac, m4a) в папку
#      plugins/CustomDiscs/songs/
#   2. Перезапускаешь сервер (или пишешь /disc import)
#   3. Готово: /disc give <id>  — id появится в /disc list
#
#  Плагин САМ: конвертирует в нужный формат, рисует текстуру,
#  собирает текстурпак (SmakcraftMusic.zip) и регистрирует
#  песню в проигрывателе (без датапаков!).
#
#  Требование для конвертации mp3: ffmpeg.
#  Если его нет в системе — плагин попробует скачать сам в bin/,
#  либо укажи путь вручную в ffmpeg-path. ОГГ-файлы принимаются
#  и без ffmpeg (копируются как есть).
# ============================================================

# Импортировать всё из папки songs/ автоматически при старте сервера
auto-import: true

# Пересобирать текстурпак при каждом старте (держать SmakcraftMusic.zip актуальным)
auto-rebuild-pack: true

# Базовый ванильный диск для импортируемых пластинок
auto-material: MUSIC_DISC_13

# Исходный текстурпак для слияния (путь к zip). Если пусто — плагин
# соберёт отдельный минимальный пак сам.
# Пример: поставь сюда свой KSEPSP-пак, и SmakcraftMusic.zip будет
# содержать и KSEPSP, и все твои пластинки (один пак для клиентов!).
resourcepack-source: ""

# Путь к ffmpeg/ffprobe (папка или сам бинарник). Пусто = авто:
# сначала поиск в системе, потом автоскачивание в plugins/CustomDiscs/bin/
ffmpeg-path: ""

# ------------------------------------------------------------
#  Пластинки (заполняется автоматически, но можно править)
# ------------------------------------------------------------
#  display_name  — ТОЧНОЕ имя предмета = триггер текстурки (без &-кодов!)
#  material      — базовый ванильный диск
#  lore          — описание (можно &-коды)
#  sound         — звук для /disc play (ключ из текстурпака)
#  jukebox_song  — песня в настоящем проигрывателе (регистрирует плагин)

discs:
  # Первая пластинка — добавлена автором :)
  dora:
    display_name: "Дора дура"
    material: MUSIC_DISC_13
    lore:
      - "&8KSEPSP Custom Disc"
      - "&dТрек: &fДОРА — дора дура"
      - "&7Длительность: &f2:14"
    sound: "ksepsp:records.dora_dura"
    jukebox_song: "ksepsp:dora_dura"
